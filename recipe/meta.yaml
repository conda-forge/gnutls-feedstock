{% set version = "3.8.13" %}
{% set major_minor = ".".join(version.split(".")[:2]) %}

package:
  name: gnutls
  version: {{ version }}

source:
  url: https://www.gnupg.org/ftp/gcrypt/gnutls/v{{ major_minor }}/gnutls-{{ version }}.tar.xz
  sha256: ffed8ec1bf09c2426d4f14aae377de4753b53e537d685e604e99a8b16ca9c97e
  patches:
    # https://gitlab.com/gnutls/gnutls/-/issues/660
    - correct_ssl_test.patch
    # mini-dtls-fragments uses gnulib's stdlib.h replacement (free -> rpl_free)
    # via -I gl, but its LDADD doesn't include ../gl/libgnu.la, so the test
    # fails to link on linux-64 and osx-64.
    - link_mini_dtls_fragments_with_libgnu.patch

build:
  number: 1
  skip: true  # [win]
  run_exports:
    # https://abi-laboratory.pro/?view=timeline&l=gnutls
    - {{ pin_subpackage('gnutls', max_pin='x.x') }}

requirements:
  build:
    - gnuconfig  # [unix]
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
    - make
    - pkg-config
  host:
    - gettext                # [osx]
    - libidn2
    - nettle
    - libtasn1
    - p11-kit
    # Test only dependencies
    - datefudge              # [linux]
    - gmp

test:
  commands:
    - test -f ${PREFIX}/lib/libgnutls${SHLIB_EXT}    # [unix]
    - test -f ${PREFIX}/lib/libgnutlsxx${SHLIB_EXT}  # [unix]

about:
  home: http://www.gnutls.org/index.html
  license: LGPL-2.1-or-later
  license_family: LGPL
  license_file:
    - COPYING
    - COPYING.LESSERv2
  summary: GnuTLS is a secure communications library implementing the SSL, TLS and DTLS protocols
  doc_url: http://www.gnutls.org/documentation.html
  dev_url: https://gitlab.com/gnutls/gnutls/tree/master

extra:
  recipe-maintainers:
    - sachalau
    - sdvillal
    - scopatz
    - hmaarrfk
    - traversaro
